<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2229"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#933718"/>
      <stop offset="0.5" stop-color="#c85a32"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#c85a32" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c85a32" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <rect x="12" y="12" width="776" height="576" rx="18" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="62" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="3">OUR LEGACY &amp; HISTORY</text>
  <text x="400" y="104" text-anchor="middle" fill="#ffffff" font-family="Playfair Display, Georgia, serif" font-size="32" font-weight="700">Six Decades of Industrial Excellence</text>
  <text x="400" y="132" text-anchor="middle" fill="#cbd5e1" font-size="14">From fireclay mining in 1960 to advanced forging today</text>

  <!-- Timeline line -->
  <rect x="60" y="328" width="680" height="4" rx="2" fill="url(#line)"/>

  <!-- Connectors -->
  <g stroke="#c85a32" stroke-width="2" stroke-dasharray="4 4">
    <line x1="120" y1="270" x2="120" y2="330"/>
    <line x1="307" y1="270" x2="307" y2="330"/>
    <line x1="493" y1="270" x2="493" y2="330"/>
    <line x1="680" y1="270" x2="680" y2="330"/>
  </g>

  <!-- Nodes -->
  <g fill="#fbbf24" stroke="#14171c" stroke-width="3">
    <circle cx="120" cy="330" r="9"/>
    <circle cx="307" cy="330" r="9"/>
    <circle cx="493" cy="330" r="9"/>
    <circle cx="680" cy="330" r="9"/>
  </g>

  <!-- Icon circles -->
  <g fill="#14171c" stroke="#fbbf24" stroke-width="2.5">
    <circle cx="120" cy="215" r="55"/>
    <circle cx="307" cy="215" r="55"/>
    <circle cx="493" cy="215" r="55"/>
    <circle cx="680" cy="215" r="55"/>
  </g>

  <!-- Icon 1: Mine / mountain -->
  <g transform="translate(120,215)">
    <polygon points="-32,24 -10,-20 4,2 16,-12 34,24" fill="#c85a32"/>
    <path d="M-9 24 v-13 a9 9 0 0 1 18 0 v13z" fill="#14171c"/>
    <circle cx="22" cy="-26" r="5" fill="#fbbf24"/>
  </g>

  <!-- Icon 2: Pickaxe -->
  <g transform="translate(307,215)" fill="none" stroke-linecap="round">
    <line x1="-24" y1="28" x2="18" y2="-14" stroke="#fbbf24" stroke-width="6"/>
    <path d="M-10 -26 Q22 -34 34 0" stroke="#c85a32" stroke-width="8"/>
  </g>

  <!-- Icon 3: Firebricks -->
  <g transform="translate(493,215)" fill="#c85a32" stroke="#14171c" stroke-width="1.5">
    <rect x="-30" y="-24" width="28" height="13" rx="2"/>
    <rect x="2" y="-24" width="28" height="13" rx="2"/>
    <rect x="-14" y="-9" width="28" height="13" rx="2"/>
    <rect x="-30" y="-9" width="14" height="13" rx="2"/>
    <rect x="16" y="-9" width="14" height="13" rx="2"/>
    <rect x="-30" y="6" width="28" height="13" rx="2"/>
    <rect x="2" y="6" width="28" height="13" rx="2"/>
    <path d="M0 -44 C-8 -34 -6 -30 0 -26 C6 -30 8 -34 0 -44Z" fill="#fbbf24" stroke="none"/>
  </g>

  <!-- Icon 4: Anvil + sparks -->
  <g transform="translate(680,215)">
    <path d="M-32,-8 H26 L36,-8 Q22,0 12,2 V12 H24 V24 H-24 V12 H-12 V2 Q-26,0 -32,-8Z" fill="#c85a32"/>
    <g fill="#fbbf24">
      <circle cx="-12" cy="-22" r="3"/>
      <circle cx="0" cy="-30" r="3.5"/>
      <circle cx="12" cy="-22" r="3"/>
      <circle cx="22" cy="-30" r="2"/>
    </g>
  </g>

  <!-- Years -->
  <g fill="#fbbf24" font-family="Playfair Display, Georgia, serif" font-size="26" font-weight="700" text-anchor="middle">
    <text x="120" y="378">1960</text>
    <text x="307" y="378">1975</text>
    <text x="493" y="378">1990</text>
    <text x="680" y="378">2020–25</text>
  </g>

  <!-- Titles -->
  <g fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">
    <text x="120" y="408">The Foundation</text>
    <text x="307" y="408">Growth</text>
    <text x="493" y="408">Manufacturing</text>
    <text x="680" y="408">Diversification</text>
  </g>

  <!-- Descriptions -->
  <g fill="#cbd5e1" font-size="12.5" text-anchor="middle">
    <text x="120" y="432">First fireclay mine</text>
    <text x="120" y="450">established</text>
    <text x="307" y="432">Second fireclay mine</text>
    <text x="307" y="450">deepens supply</text>
    <text x="493" y="432">First refractory unit:</text>
    <text x="493" y="450">Jai Mahadev Fire Bricks</text>
    <text x="680" y="432">Metal forging via Mahadev</text>
    <text x="680" y="450">Forge, parts for Tata Motors</text>
  </g>

  <!-- Footer -->
  <line x1="250" y1="498" x2="550" y2="498" stroke="#c85a32" stroke-opacity="0.6"/>
  <text x="400" y="530" text-anchor="middle" fill="#fbbf24" font-family="Playfair Display, Georgia, serif" font-size="17" font-style="italic">Rooted in Heritage. Driven by Industry. Focused on the Future.</text>
  <text x="400" y="560" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="3">MAA ADYA FORGE &amp; REFRACTORIES</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
